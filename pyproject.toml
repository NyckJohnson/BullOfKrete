[project]
name = "bullofkrete"
version = "2.0.0"
description = "Agent pipeline for building apps with Claude Code: a Python command plus a Claude Code plugin"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bull = "bull.Modules.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bull"]

# Built-in stacks' fixture/ and app/ folders (src/bull/Modules/stack_*/<stack>/fixture|app) are
# test data shipped with the package: excluded from bull's own pytest, mypy, ruff and coverage.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["fixture", "app", ".*", "__pycache__"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
exclude = ['^src/bull/Modules/stack_[^/]+/[^/]+/(fixture|app)/']

[tool.ruff]
target-version = "py311"
extend-exclude = [
    "src/bull/Modules/stack_*/*/fixture",
    "src/bull/Modules/stack_*/*/app",
]

[tool.coverage.run]
source = ["src/bull"]
omit = [
    "src/bull/Modules/stack_*/*/fixture/*",
    "src/bull/Modules/stack_*/*/app/*",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "coverage[toml]>=7",
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest-cov>=7.1.0",
]
