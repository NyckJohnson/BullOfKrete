[project]
name = "fixture_cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fixture_cli = "fixture_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixture_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "coverage[toml]>=7", "mypy>=1.11", "ruff>=0.6"]
